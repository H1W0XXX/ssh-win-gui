name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: src/RsyncShell.RsyncWorker/go.sum

      - name: Test and publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ssh-win-gui-win-x64
          path: artifacts/publish/ssh-win-gui-win-x64.zip
          if-no-files-found: error
          retention-days: 14
